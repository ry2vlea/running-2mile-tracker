<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7">
  <meta name="description" content="2-mile running tracker. Goal: 15:00 or faster. Speed, endurance, and weekly miles.">
  <title>Running — 2-mile speed, endurance, weekly progress</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%23b42318'/%3E%3Cpath d='M2.5 11.5c1.4-3.2 2.4-4.6 3.5-4.6s1.6 1.4 2.6 1.4 2.1-2.2 4.9-3.8' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#kpis">Skip to the numbers</a>
  <header class="site-header">
    <p class="eyebrow">San Juan, Puerto Rico</p>
    <h1>RUNNING — 2-MILE SPEED · ENDURANCE · WEEKLY PROGRESS</h1>
    <p class="goal-line">2 miles in 15:00 or faster · 7:30 per mile</p>
  </header>
  <main>
    <div id="status"></div>
    <section id="kpis" class="kpis" aria-label="Key numbers"></section>
    <div class="charts">
      <article class="card" id="chart-two-mile"></article>
      <article class="card" id="chart-endurance"></article>
      <article class="card" id="chart-weekly"></article>
    </div>
    <section class="card" id="recent" aria-label="Recent activities"></section>
    <section id="flagged"></section>
  </main>
  <footer class="site-footer">
    <p>One row per activity in <a href="data/running_data.csv">data/running_data.csv</a>. Transport walks stay out of exercise mileage.</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
